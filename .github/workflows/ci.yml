name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Tests use Swift Testing, which needs Xcode 16+. Pin to a specific
      # version rather than `latest-stable`: the runner image can have a
      # newer Xcode installed before its matching iOS Simulator runtime is
      # provisioned, which leaves xcodebuild with no concrete simulator
      # destinations to run against. 16.4 is the runner's default Xcode and
      # is guaranteed to ship with a matching runtime.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      # GmrtdKit's binary target is iOS-only, so plain `swift build`/`swift
      # test` (which target the host Mac) can't resolve it — has to build
      # against an iOS Simulator destination via xcodebuild instead. Look up
      # a simulator that's actually provisioned on the runner rather than
      # hardcoding a device name, since the set of pre-created simulators for
      # a given Xcode version varies across runner image updates.
      - run: |
          set -euo pipefail
          RUNTIME_ID=$(xcrun simctl list runtimes -j | jq -r '
            [.runtimes[] | select(.isAvailable) | select(.name | startswith("iOS"))]
            | sort_by(.version | split(".") | map(tonumber))
            | last | .identifier')
          DEVICE_NAME=$(xcrun simctl list devices -j | jq -r --arg rt "$RUNTIME_ID" '
            .devices[$rt][] | select(.isAvailable) | select(.name | test("^iPhone")) | .name' | head -1)
          echo "Testing against: $DEVICE_NAME ($RUNTIME_ID)"
          xcodebuild test -scheme GmrtdKit -destination "platform=iOS Simulator,name=$DEVICE_NAME"
