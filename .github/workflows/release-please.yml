name: release-please
on:
  push:
    branches: [main]
# Read-only by default; only the release job gets the write access it needs to
# open release PRs and create tags/releases (Scorecard Token-Permissions).
permissions:
  contents: read
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
